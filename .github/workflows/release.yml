name: release

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      GOARCH: "amd64"
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.0'
    - name: Build
      run: make
    - uses: ncipollo/release-action@v1
      with:
        artifacts: build/*
        allowUpdates: true
        draft: true
        omitBodyDuringUpdate: true
